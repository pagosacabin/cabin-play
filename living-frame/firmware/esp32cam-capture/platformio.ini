; 0230 rung 1 — ESP32-CAM (AI-Thinker, OV2640) minimal capture build.
;
; Purpose: prove a genuine OV2640 capture exists as a valid JPEG, and sink it to
; the CAM's own microSD slot (1-bit SD_MMC: CLK 14, CMD 15, D0 2).
;
; Reporting: this board has no USB; the console is the CH340 UART adapter's
; TX/RX (115200). Every result line is prefixed REPORT: so a capture log can be
; parsed. The JPEG is also dumped as base64 so the laptop can hold a byte-exact
; copy even when no card is seated in the CAM slot (verified against the
; camera-side SHA-256).
;
; Flashing: the CAM has no reset-button-free auto-reset path through every
; adapter; esptool's default DTR/RTS sequence works on the CH340 here (GPIO0
; strap via RTS). See README.md.

[env:esp32cam]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
board_build.flash_size = 4MB
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<main.cpp>
lib_deps =
    espressif/esp32-camera@2.0.4

; Bring-up diagnostic used when the camera probe fails: SCCB bus scan with XCLK
; off / 20 MHz / 10 MHz, plus the OV2640 PID register read.
[env:esp32cam-diag]
extends = env:esp32cam
build_src_filter = +<diag_main.cpp>

; Rung 2: ESP-NOW link test -- sends the deterministic 32x240 B transfer to the
; frame board's MAC. No camera, no SD, no radio AP.
[env:esp32cam-espnow-tx]
extends = env:esp32cam
build_src_filter = +<espnow_tx_main.cpp>

; Board identity + SD-slot probe (read-only): MAC, flash, PSRAM, card presence.
[env:esp32cam-probe]
extends = env:esp32cam
build_src_filter = +<probe_main.cpp>

