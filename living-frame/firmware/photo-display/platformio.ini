; Living-frame rung 1 -- photo display firmware
;
; Target board: classic ESP32-WROOM-32 devkit (esp32dev). NOT an ESP32-S3:
; the S3 has no proven VGA path in this project (see ../vga-proof/README.md).
;
; Library: bitluni's ESP32Lib, reused in place from ../vga-proof/lib/ESP32Lib
; (vendored there, patched for arduino-esp32 2.x -- see its NOTICE.md). It is
; referenced rather than copied so there is exactly one copy of the vendored
; library in the repo and both rungs build against identical source.
;
; JPEG decoding: TJpgDec (elm-chan, R0.03), vendored under lib/TJpgDec with the
; two-line configuration this project needs. Decoded MCU-by-MCU straight into
; the VGA frame buffer, so no full-image buffer is ever allocated.
;
; The photo is compiled into the firmware (board_build.embed_files), so there
; is no SD card and no filesystem in this rung; a clean clone reproduces the
; exact bytes of the image.

[env:esp32dev]
platform = espressif32@6.12.0   ; pins arduino-esp32 2.0.17 (ESP-IDF 4.4)
board = esp32dev                ; generic ESP32-WROOM-32 devkit, 4 MB flash
framework = arduino
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DCORE_DEBUG_LEVEL=0

lib_extra_dirs = ../vga-proof/lib

; photo.jpg is embedded as a raw binary: the linker exposes
;   _binary_data_photo_jpg_start / _binary_data_photo_jpg_end
board_build.embed_files = data/photo.jpg
