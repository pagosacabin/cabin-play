; 0226 -- 64-colour port, full native 640x480, on the wired N16R8 board.
; Same LCD_CAM RGB driver path as 0180 (photo-display-s3); the only structural
; change is the framebuffer: 8 bpp in PSRAM instead of 4 bpp in internal RAM.
[env:n16r8-vga64]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
