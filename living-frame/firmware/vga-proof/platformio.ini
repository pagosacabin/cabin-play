; Living-frame rung 0 — VGA proof firmware
;
; Target board: classic ESP32-WROOM-32 devkit (also fits the DFRobot FireBeetle
; ESP32-E / DFR-0654).  NOT an ESP32-S3 board: the S3 has no proven VGA path in
; this project.
;
; Library: bitluni's ESP32Lib, VENDORED under lib/ESP32Lib (see
; lib/ESP32Lib/NOTICE.md).  Vendored rather than pulled from the registry or
; from git because upstream needs a two-line fix to compile against the
; arduino-esp32 2.x core that PlatformIO installs today — with the fix applied
; in the tree, the project builds with no patching step and no network fetch
; for the library.
;
; Why ESP32Lib and not FabGL: ESP32Lib is the library the classic-ESP32 VGA
; community has used for this exact job for years (VGA out over I2S), it is
; small, and its 3-bit driver keeps a 640x480 frame buffer inside the ESP32's
; internal SRAM.  WIRING.md explains why 640x480 forces 3-bit colour.

[env:esp32dev]
platform = espressif32@6.12.0   ; pins arduino-esp32 2.0.17 (ESP-IDF 4.4)
board = esp32dev                ; generic ESP32-WROOM-32 devkit, 4 MB flash
framework = arduino
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DCORE_DEBUG_LEVEL=0
