; CAM side of the ESP-NOW still-image link (0230).
; Board: Freenove ESP32-Wrover CAM (GC0308) on CH340 /dev/ttyUSB1.
[env:freenove-cam]
platform = espressif32@6.12.0
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
