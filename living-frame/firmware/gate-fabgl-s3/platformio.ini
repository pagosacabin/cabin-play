; 0178 step-1 gate — can FabGL 1.0.9 drive the 64-colour bitmapped VGA controller
; on an ESP32-S3 (Heltec WiFi LoRa 32 V3), with the task's fixed pin map?
;
; This project is the compile half of that gate. It contains no application code:
; it initialises fabgl::VGAController with the eight agreed pins and sets
; VGA_640x480_60Hz, which is the exact configuration step 3 would need.
;
; Result: it does not compile. See ../logs/ and README.md.

[env:heltec]
platform = espressif32@6.12.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    fabgl@1.0.9
