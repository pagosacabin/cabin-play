; 0229 -- SD card diagnosis on the frame board (N16R8, ESP32-S3, MAC c4:9e:7e:08:6d:f4).
;
; The FT232R bridge on this bench delivers no usable console (0225), so the log
; goes to the `report` data partition at 0x310000 and is read back with
;   esptool --chip esp32s3 --port /dev/ttyUSB0 --baud 460800 read_flash 0x310000 0x10000 report.bin
;
; The probe walks 0229's ladder in firmware: CMD-level SPI identification,
; sdmmc_card_init over SPI at 400 kHz and at the default clock, the same init
; with internal pull-ups forced on MISO/CS (rung 3 as far as software can take
; it), and SDMMC 1-bit on the same pins (rung 4).  READ-ONLY on the card: no
; mount with write access, no format, no writes.
;
; Slot layout is identical to 0225/0227 so the same report read-back offset works.
[env:n16r8-sdprobe]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
