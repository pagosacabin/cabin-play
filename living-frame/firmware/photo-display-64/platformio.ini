; Living-frame rung 2 -- 64-color photo display firmware
;
; Target board: classic ESP32-WROOM-32 devkit (esp32dev), the same board that
; ran rung 1 (MAC 4c:c3:82:da:d5:68). NOT an ESP32-S3: the S3 has no proven VGA
; path in this project.
;
; Graphics library: FabGL 1.0.9, pinned. fabgl::VGAController is the 64-color
; (2 bits per channel) bitmapped controller; its 8-argument begin() takes
; (red1, red0, green1, green0, blue1, blue0, hsync, vsync), so the agreed pin
; map is a supported configuration. No fork, no local patch.
;
; JPEG decoding: TJpgDec R0.03 (elm-chan), vendored under ../photo-display/lib
; and reused in place (lib_extra_dirs) so both rungs build the identical
; decoder source. 640x480 source, 1/2 descale -> 320x240, MCU-by-MCU straight
; into the VGA frame buffer: no full-image buffer is ever allocated.
;
; The photo is compiled into the firmware (board_build.embed_files), so there
; is no SD card and no filesystem in this rung; a clean clone reproduces the
; exact bytes of the image.

[env:esp32dev]
platform = espressif32@6.12.0   ; pins arduino-esp32 2.0.17 (ESP-IDF 4.4), as rung 1
board = esp32dev                ; generic ESP32-WROOM-32 devkit, 4 MB flash
framework = arduino
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFABGL_PINNED_VERSION='"1.0.9"'

lib_deps =
    fabgl@1.0.9

lib_extra_dirs = ../photo-display/lib

; photo.jpg is embedded as a raw binary: the linker exposes
;   _binary_data_photo_jpg_start / _binary_data_photo_jpg_end
; It is a byte-identical copy of rung 1's data/photo.jpg (sha256 verified, see
; README) rather than a ../ path, because the linker symbol name is derived
; from the path inside the project.
board_build.embed_files = data/photo.jpg
