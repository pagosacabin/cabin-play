# Guition JC4827W543C — 4.3" 480x272 IPS, ESP32-S3-WROOM-1-N4R8 (4 MB flash / 8 MB OPI PSRAM)
# Board verified on the bench 2026-10-13 as MAC 44:bd:8d:7a:cc:cc, /dev/ttyACM2.
# Panel controller NV3041A over QSPI is PROVEN from the factory firmware's own init table,
# not from the vendor PDF (which wrongly claims "ST3401A").
# Config follows the official ESPHome device page for this board:
#   https://devices.esphome.io/devices/guition-jc4827543c
#
# Display: two pages. The normal page is an LCARS-styled readout of the bench pack's JK BMS,
# framed by elbow bars (a column down the left edge turning into the header bar, a mirror of
# it off the clock's right end) -- the panel's own cell and the clock in the header strip,
# state of charge as a dial, then pack volts, charge/discharge current and temperature as
# labelled data pills.
# When the panel's own cell falls below ${low_batt_pct}% the display swaps to the plain
# status page (model, its own battery voltage/percentage, battery icon).
substitutions:
  name: jc4827w543
  friendly_name: Bench Panel 4.3
  # Panel-local low-battery threshold, in percent. Below this the display replaces the BMS
  # page with the plain status page (model + the panel's own pack), so a panel running flat
  # says "charge me" instead of showing cabin data it cannot keep live. Left unquoted on
  # purpose: it is substituted into the display lambda as a C++ literal.
  low_batt_pct: 10
  # Load-sag compensation for the panel's own cell, in volts per unit of backlight duty
  # (0 = off, 1 = full). The SoC curve below is a RESTING-voltage curve, but the reading is the
  # cell's terminal voltage under this panel's own load, so it sits low; the backlight is the
  # largest single load and its duty is known, so that part is added back. Measured on this board
  # by tools/calibrate_batt_sag.py: 39 mV at full duty, ~6.5 points of state of charge. The
  # constant part of the sag (ESP32 + WiFi, which never switch off) stays uncompensated -- the
  # ADC alone cannot separate it from the cell's true resting voltage.
  batt_sag_v_per_duty: "0.0392"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio          # vendor demo/spec use DIO, not QIO
  on_boot:
    priority: -100
    then:
      - script.execute: inactivity_timer
      - component.update: my_display

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

# Top-level component in current ESPHome (not nested under esp32):
# the N4R8 module carries octal/OPI PSRAM.
psram:
  mode: octal
  speed: 80MHz

logger:
  # The board's console is its native USB (USB-Serial/JTAG), not a UART bridge.
  level: INFO

api:
  # Keyless on purpose: there is no ESPHome dashboard on this network to read a generated
  # key from, and Home Assistant adopts an unencrypted API device without prompting. To
  # lock it down later, add `encryption: {key: !secret api_encryption_key}`, put a 32-byte
  # base64 key in secrets.yaml, and re-flash over USB once.

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # No fallback hotspot: if the join fails we revisit over USB, where the
  # console is always available.
  power_save_mode: none                  # a wall/mains panel wants latency over mW

# ------------------------------------------------------- battery state (inferred)
# There is no charger status pin on this board: the vendor's own notes say the TP4056's status
# leg is not connected to the ESP32, so "is it charging?" has to come from the reading itself.
# The charger parks the BAT net on its CV plateau -- the TP4056 holds 4.20 V there -- whereas
# a cell running the panel reads 4.05 with the backlight on and 4.16 at most with it off. So
# the test is a band plus a two-poll debounce, not a trend.
#
# A trend test was tried first and thrown away: +-3 mV between 30 s polls is under the noise
# floor of the smoothed reading (+-15 mV in the live history), so it flapped CHG/BATT ~50 times
# during a single discharge. The band cannot do that -- and tools/test_batt_state.py replays the
# real 24 h history to hold the transition count and the CHG coverage, precisely to keep it so.
#
# Scope, deliberately: this sees the CV plateau. A charger in bulk (below the plateau) drives
# the net from the cell's own voltage, so the label reads BATT and the percentage climbs
# through real values -- honest, and the case the mask is not needed for.
globals:
  - id: batt_charging
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: batt_agree                     # consecutive polls agreeing that a change is due
    type: int
    restore_value: no
    initial_value: '0'

# ---------------------------------------------------------------- backlight
output:
  - platform: ledc
    pin: 1                               # GFX_BL / LCD_BL on GPIO1 (all sources agree)
    id: gpio_backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    id: display_backlight
    icon: mdi:lightbulb-on
    restore_mode: ALWAYS_ON

# ---------------------------------------------------------------- touch (GT911)
i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO4
    scan: true
    frequency: 400kHz

touchscreen:
  - platform: gt911
    id: my_touchscreen
    i2c_id: bus_a
    interrupt_pin:
      number: 3
      ignore_strapping_warning: true
    reset_pin: GPIO38
    transform:
      mirror_x: true
      mirror_y: true
    # Without this binding the panel is a display with no input: the GT911 still reports
    # touches on I2C and the interrupt still fires, but nothing acts on them, so the
    # backlight never comes back after the inactivity timer switches it off. Every touch
    # restarts the timer, whose first step also turns the backlight back on at full.
    on_touch:
      then:
        - script.execute: inactivity_timer

# ---------------------------------------------------------------- panel (NV3041A, quad SPI)
# KNOWN-GOOD configuration for this unit. Do NOT "modernise" this block to the mipi_spi
# platform / built-in `model: JC4827W543` preset: that build drove this panel into a
# rainbow-noise state (2026-10-13), while this explicit form renders correctly. qspi_dbi
# is deprecated (a warning, not an error) -- a working picture outranks a clean warning.
spi:
  id: quad_spi
  type: quad
  clk_pin: GPIO47
  data_pins: [21, 48, 40, 39]

display:
  - platform: qspi_dbi
    id: my_display
    update_interval: never               # only repaint when something changes
    auto_clear_enabled: false
    model: CUSTOM
    data_rate: 20MHz
    dimensions:
      width: 480
      height: 272
    cs_pin:
      number: 45
      ignore_strapping_warning: true
    invert_colors: true
    rotation: 180
    init_sequence:
      - [0xff, 0xa5]
      - [0x36, 0xc0]
      - [0x3A, 0x01]
      - [0x41, 0x03]
      - [0x44, 0x15]
      - [0x45, 0x15]
      - [0x7d, 0x03]
      - [0xc1, 0xbb]
      - [0xc2, 0x05]
      - [0xc3, 0x10]
      - [0xc6, 0x3e]
      - [0xc7, 0x25]
      - [0xc8, 0x11]
      - [0x7a, 0x5f]
      - [0x6f, 0x44]
      - [0x78, 0x70]
      - [0xc9, 0x00]
      - [0x67, 0x21]
      - [0x51, 0x0a]
      - [0x52, 0x76]
      - [0x53, 0x0a]
      - [0x54, 0x76]
      - [0x46, 0x0a]
      - [0x47, 0x2a]
      - [0x48, 0x0a]
      - [0x49, 0x1a]
      - [0x56, 0x43]
      - [0x57, 0x42]
      - [0x58, 0x3c]
      - [0x59, 0x64]
      - [0x5a, 0x41]
      - [0x5b, 0x3c]
      - [0x5c, 0x02]
      - [0x5d, 0x3c]
      - [0x5e, 0x1f]
      - [0x60, 0x80]
      - [0x61, 0x3f]
      - [0x62, 0x21]
      - [0x63, 0x07]
      - [0x64, 0xe0]
      - [0x65, 0x02]
      - [0xca, 0x20]
      - [0xcb, 0x52]
      - [0xcc, 0x10]
      - [0xcd, 0x42]
      - [0xd0, 0x20]
      - [0xd1, 0x52]
      - [0xd2, 0x10]
      - [0xd3, 0x42]
      - [0xd4, 0x0a]
      - [0xd5, 0x32]
      - [0x80, 0x00]
      - [0xa0, 0x00]
      - [0x81, 0x07]
      - [0xa1, 0x06]
      - [0x82, 0x02]
      - [0xa2, 0x01]
      - [0x86, 0x11]
      - [0xa6, 0x10]
      - [0x87, 0x27]
      - [0xa7, 0x27]
      - [0x83, 0x37]
      - [0xa3, 0x37]
      - [0x84, 0x35]
      - [0xa4, 0x35]
      - [0x85, 0x3f]
      - [0xa5, 0x3f]
      - [0x88, 0x0b]
      - [0xa8, 0x0b]
      - [0x89, 0x14]
      - [0xa9, 0x14]
      - [0x8a, 0x1a]
      - [0xaa, 0x1a]
      - [0x8b, 0x0a]
      - [0xab, 0x0a]
      - [0x8c, 0x14]
      - [0xac, 0x08]
      - [0x8d, 0x17]
      - [0xad, 0x07]
      - [0x8e, 0x16]
      - [0xae, 0x06]
      - [0x8f, 0x1B]
      - [0xaf, 0x07]
      - [0x90, 0x04]
      - [0xb0, 0x04]
      - [0x91, 0x0a]
      - [0xb1, 0x0a]
      - [0x92, 0x16]
      - [0xb2, 0x15]
      - [0xff, 0x00]
      - [0x11, 0x00]
      - [0x29, 0x00]
    lambda: |-
      // Repaint from a clean slate: auto_clear_enabled is false and this lambda runs on every
      // sensor/time change, so text would otherwise smear into itself.
      it.fill(COLOR_OFF);

      const float local = id(batt_pct).state;

      // ---- fallback page: the panel's own pack is nearly flat --------------------------
      // Below ${low_batt_pct}% this replaces the BMS page with the screen the panel has
      // always shown: what it is, and what its own cell is doing. Cabin data is worthless on
      // a panel that is about to die.
      if (!isnan(local) && local < ${low_batt_pct}) {
        it.print(240, 24, id(roboto_24), TextAlign::CENTER, "JC4827W543 up");
        if (!isnan(local)) {
          char sbuf[48];
          snprintf(sbuf, sizeof(sbuf), "BAT %3.0f%%   %.2f V", local, id(batt_v).state);
          it.print(240, 84, id(roboto_24), TextAlign::CENTER, sbuf);
        } else {
          it.print(240, 84, id(roboto_24), TextAlign::CENTER, "BAT --");
        }
        const int bx = 170, by = 150, bw = 120, bh = 52, nub = 8, pad = 4;
        it.rectangle(bx, by, bw, bh, COLOR_ON);
        it.filled_rectangle(bx + bw + 1, by + bh / 3, nub, bh / 3, COLOR_ON);
        int fillw = (int)((bw - 2 * pad) * local / 100.0f);
        if (fillw > 0) it.filled_rectangle(bx + pad, by + pad, fillw, bh - 2 * pad, COLOR_ON);
        return;
      }

      // ---- BMS page: LCARS console -----------------------------------------------------
      // TNG console framing. The signature shapes are the elbow bars: a column down the left
      // edge that turns right into the header bar, and a short bar turning down off the
      // clock's right end. Each elbow is the *union* of two bars plus a black disc cut out of
      // the inner corner -- that concave cut is the whole idiom; two bars merely crossed read
      // as a plus sign. Palette is the task's hex list verbatim.
      const Color ORANGE(255, 153, 0),        // #FF9900
          GOLD(255, 204, 153),                // #FFCC99
          SALMON(204, 102, 102),              // #CC6666
          PURPLE(204, 153, 204),              // #CC99CC
          PERIWINKLE(153, 153, 255),          // #9999FF
          PALE(255, 255, 204),                // #FFFFCC
          DIM(44, 44, 80),                    // unlit dial arc (functional, not in the hex list)
          INK(0, 0, 0);

      // An LCARS pill: straight body, a filled circle capping each end. Text drawn on one must
      // be printed with the pill colour as its `background`, because the font blends glyph
      // edges against that colour -- black would ring every letter.
      //
      // The heights are ODD on purpose: filled_circle covers 2r+1 px (its loop starts at
      // dx = -radius and draws 2*(-dx)+1 across), so with an even height the caps overhang the
      // body by a pixel above, below and past each end -- visible on every pill on the page.
      // With h = 2r+1 and the caps centred r in from each end, the cap boxes are exactly the
      // end h x h cells of the pill.
      auto pill = [&](int x, int y, int w, int h, Color c) {
        const int r = (h - 1) / 2;
        it.filled_rectangle(x + r, y, w - 2 * r, h, c);
        it.filled_circle(x + r, y + r, r, c);
        it.filled_circle(x + w - 1 - r, y + r, r, c);
      };

      // The same shape stood on end, for the column and the bars turning off the header. One
      // helper per orientation, because the cap radius comes from the SHORT side: a tall pill
      // built with the horizontal maths would be a disc the size of the page.
      auto vbar = [&](int x, int y, int w, int h, Color c) {
        const int r = (w - 1) / 2;
        it.filled_rectangle(x, y + r, w, h - 2 * r, c);
        it.filled_circle(x + r, y + r, r, c);
        it.filled_circle(x + r, y + h - 1 - r, r, c);
      };

      char buf[64];
      const bool have_time = id(ha_time).now().is_valid();

      // Header: the panel's own cell and the clock, 20 pt PILL type -- at arm's length this
      // is a status strip, not a headline. Both blank rather than fake when their source has
      // not reported yet.
      // Charging is masked, not guessed: with the cable in this reading is the charger's
      // voltage, so a percentage would be a confident lie. CHG says only what is known.
      if (isnan(local)) snprintf(buf, sizeof(buf), "PANEL --");
      else if (id(batt_charging)) snprintf(buf, sizeof(buf), "PANEL CHG");
      else snprintf(buf, sizeof(buf), "PANEL %.0f%%", local);

      // Column and header share a corner: both bars are 27 px across, so their end caps are
      // the same 13 px disc and the union is a single L with a round outer corner. The clock
      // segment gets the mirrored treatment at its right end.
      vbar(8, 4, 27, 260, ORANGE);          // column, y 4..263
      vbar(445, 4, 27, 60, PERIWINKLE);     // right elbow, y 4..63
      pill(8, 4, 202, 27, ORANGE);          // header: panel segment
      pill(240, 4, 232, 27, PERIWINKLE);    // header: clock segment
      pill(206, 11, 38, 11, GOLD);          // the bar joining them

      // The inner corners, cut concave. Drawn after every bar they belong to, and before any
      // text: this is a subtraction, so anything drawn earlier at that corner would be eaten.
      it.filled_circle(34, 30, 9, INK);
      it.filled_circle(445, 30, 9, INK);

      it.print(8 + 101, 7, id(roboto_hdr), INK, TextAlign::TOP_CENTER, buf, ORANGE);
      if (have_time) snprintf(buf, sizeof(buf), "%s", id(ha_time).now().strftime("%H:%M").c_str());
      else snprintf(buf, sizeof(buf), "--:--");
      it.print(240 + 116, 7, id(roboto_hdr), INK, TextAlign::TOP_CENTER, buf, PERIWINKLE);

      // A section divider closing the header off from the dial. It stops short of the right
      // elbow so that elbow stays one unbroken shape.
      pill(44, 35, 393, 7, GOLD);

      // The dial: a chain of overlapping discs along the arc. Two earlier attempts are worth
      // not repeating -- 1 deg radial spokes read as stripes, and 3 deg quads (two
      // filled_triangle calls each) left 1 px seams along the shared edges, which show up as
      // dark slivers in a bright arc. Overlapping discs of the same colour cannot seam, and
      // they give the round ends for free: no separate end caps. The ring is 2*disc_r thick,
      // centred on r_mid, so r_in = r_mid - disc_r and r_out = r_mid + disc_r.
      // The arc is orange, not gold: it is the one reading that has to carry across the room,
      // so it takes the accent colour and leaves #FFCC99 to the frame. Salmon under 25% is the
      // only place this page raises its voice.
      const float soc = id(bms_soc).state;
      const int cx = 258, cy = 118, r_mid = 60, disc_r = 6;
      const Color lit = (!isnan(soc) && soc < 25.0f) ? SALMON : ORANGE;
      const float frac = isnan(soc) ? 0.0f : (soc < 0.0f ? 0.0f : (soc > 100.0f ? 100.0f : soc)) / 100.0f;
      const float RAD = 0.0174532925f;
      for (int a = 120; a <= 420; a += 3) {       // 120..420 = 300 deg, gap centred at the bottom
        const float f = (a - 120) / 300.0f;
        it.filled_circle(cx + r_mid * std::cos(a * RAD), cy + r_mid * std::sin(a * RAD), disc_r,
                         (f <= frac) ? lit : DIM);
      }
      // Nothing but the number goes inside the ring: at 48 pt a 3-digit reading plus "%" is
      // wider than the inner diameter, and a label under it crosses the lower arms. The unit
      // rides on the left-hand label, and the two dead bands beside the dial carry the label
      // and the date. The number is pale yellow (#FFFFCC): the LCARS readout colour, and the
      // brightest thing on the page -- it is where the eye should land first.
      if (isnan(soc)) snprintf(buf, sizeof(buf), "--");
      else snprintf(buf, sizeof(buf), "%.0f", soc);
      it.print(cx, cy - 24, id(roboto_48), PALE, TextAlign::TOP_CENTER, buf);
      it.print(44, cy, id(roboto_16), GOLD, TextAlign::CENTER_LEFT, "PACK SOC %");
      if (have_time) {
        it.print(464, cy, id(roboto_16), PURPLE, TextAlign::CENTER_RIGHT,
                 id(ha_time).now().strftime("%a %d %b").c_str());
      }

      // Three data pills under the dial, their columns set inside the left column and the
      // right elbow, and their outer edges flush with the header bar (44 / 471). The middle
      // column is centred on the dial, so the page reads as three aligned columns rather than
      // three slightly different ones. The current's label follows the sign: the BMS reports
      // charge positive, discharge negative, so 49 A out is not labelled CHARGE.
      auto datum = [&](int x, int w, Color bar, const char *label, const char *value) {
        pill(x, 192, w, 21, bar);
        it.print(x + w / 2, 195, id(roboto_16), INK, TextAlign::TOP_CENTER, label, bar);
        it.print(x + w / 2, 218, id(roboto_28), PALE, TextAlign::TOP_CENTER, value);
      };
      if (isnan(id(bms_v).state)) snprintf(buf, sizeof(buf), "--");
      else snprintf(buf, sizeof(buf), "%.2f V", id(bms_v).state);
      datum(44, 139, PERIWINKLE, "PACK V", buf);

      const float cur = id(bms_i).state;
      if (isnan(cur)) snprintf(buf, sizeof(buf), "--");
      else snprintf(buf, sizeof(buf), "%+.1f A", cur);
      datum(189, 139, ORANGE, (isnan(cur) || cur >= 0.0f) ? "CHARGE" : "DISCHG", buf);

      if (isnan(id(bms_t).state)) snprintf(buf, sizeof(buf), "--");
      else snprintf(buf, sizeof(buf), "%.1f F", id(bms_t).state);
      datum(334, 138, PURPLE, "TEMP", buf);

      // LCARS footer: the column turns into it at the near end, so the two are one elbow --
      // the concave cut below is the same subtraction the header elbows use.
      const int fw[5] = {110, 80, 60, 110, 80};
      const Color fc[5] = {ORANGE, GOLD, SALMON, PERIWINKLE, PURPLE};
      int bx = 8;
      for (int i = 0; i < 5; i++) {
        it.filled_rectangle(bx, 255, fw[i], 9, fc[i]);
        bx += fw[i] + 6;
      }
      it.filled_circle(34, 255, 9, INK);          // column -> footer elbow

font:
  # Sizes named for what they are: 48pt the state-of-charge number inside the dial, 28pt the
  # three data values, 24pt the fallback status page, 20pt the header pills, 16pt field
  # labels and the date.
  - file: "gfonts://Roboto"
    id: roboto_48
    size: 48
  - file: "gfonts://Roboto"
    id: roboto_28
    size: 28
  - file: "gfonts://Roboto"
    id: roboto_24
    size: 24
  - file: "gfonts://Roboto"
    id: roboto_hdr
    size: 20
  - file: "gfonts://Roboto"
    id: roboto_16
    size: 16

# ---------------------------------------------------------------- backlight sleep
# Touch or boot restarts the timer; the panel dims to off after sleep_time seconds.
# This is the battery-relevant knob: the panel is the dominant load.
script:
  - id: inactivity_timer
    mode: restart
    then:
      # any touch (or boot) wakes the panel: full brightness back
      - light.turn_on:
          id: display_backlight
          brightness: 1.0
      - component.update: my_display
      - delay: !lambda 'return id(sleep_time).state * 1000;'
      # idle: DIM to the configured level rather than going black. Set Idle brightness to 0
      # to get the old full-off behaviour back.
      - if:
          condition:
            lambda: 'return id(dim_level).state > 0.5f;'
          then:
            - light.turn_on:
                id: display_backlight
                brightness: !lambda 'return id(dim_level).state / 100.0f;'
          else:
            - light.turn_off: display_backlight

number:
  - platform: template
    name: Sleep time
    id: sleep_time
    optimistic: true
    initial_value: 60
    restore_value: yes
    unit_of_measurement: "s"
    device_class: duration
    mode: box
    min_value: 5
    max_value: 600
    step: 1

  # Slider in Home Assistant: how bright the panel sits once it has idled past Sleep time.
  # 0 = dim to nothing (panel off), the pre-2026-10-13 behaviour.
  - platform: template
    name: Idle brightness
    id: dim_level
    optimistic: true
    initial_value: 10
    restore_value: yes
    unit_of_measurement: "%"
    mode: slider
    min_value: 0
    max_value: 100
    step: 5

# Remote wake: runs the same inactivity timer a touch would, which restores full brightness
# and restarts the countdown. Makes the idle/dim behaviour testable without a finger, and
# gives HA a "light the panel now" control.
button:
  # Wakes the panel exactly as a touch does: full brightness, timer restarted. Keeps the
  # idle/dim behaviour testable without a finger, and gives HA a "light the panel now" control.
  - platform: template
    name: Wake screen
    id: wake_button
    on_press:
      - script.execute: inactivity_timer

# ---------------------------------------------------------------- clock
# Local time comes from Home Assistant over the native API, so the panel inherits HA's
# timezone and its DST rules instead of carrying a POSIX TZ string that has to be revisited
# twice a year. The minute trigger is what repaints the clock, and it doubles as a
# once-a-minute readout of every value on the page (the panel has no other way to report
# what it is actually showing).
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        then:
          - lambda: |-
              // Same condition as the display lambda's page select, and it must stay that
              // way -- this line is the only way to observe which page the panel chose.
              const float local = id(batt_pct).state;
              const bool low = !isnan(local) && local < ${low_batt_pct};
              ESP_LOGI("bms", "page=%s soc=%.0f V=%.2f I=%+.1f T=%.1f local=%.0f%%",
                       low ? "status" : "bms", id(bms_soc).state, id(bms_v).state,
                       id(bms_i).state, id(bms_t).state, local);
          - component.update: my_display

# ---------------------------------------------------------------- battery sense
# FITTED divider is 160K/220K, NOT the 33K/100K the vendor schematic draws:
#     BAT --[160K]--+--[220K]-- GND        +--[0R]--> GPIO5 == ADC1_CH4
# so the ADC sees 220/(160+220) = 0.57895 of the pack voltage: multiply by 1/0.57895
# = 1.72727 to get volts at the battery. A full 4.2 V pack puts the node at 2.43 V,
# comfortably inside a 12 dB ADC range (~3.1 V), so nothing clips -- which is why the
# attenuation below is a fixed 12db rather than `auto` (auto existed only to chase the
# 3.16 V node the WRONG divider implied; it also cannot be combined with `raw:`).
# Fitted-vs-drawn is documented for this board, not guessed:
#   https://github.com/78/xiaozhi-esp32/blob/HEAD/main/boards/guition/jc4827w543/README.md
#   -- "The battery divider is not what the schematic draws. The schematic shows
#   33K/100K, factor 1.33; the fitted parts are 160K/220K, factor ~1.73".
# History: the 1.33 factor read 3.27 V on a pack the meter put at 4.1 V (2026-10-15).
# The same ADC node, rescaled by 1.72727, reads 4.24 V -- i.e. the BAT net held at the
# charge voltage by the on-board TP4056 while USB is connected.
#
# GPIO5 stays the pin: the vendor pin table calls it "Battery divider to ADC1_CH4", and
# it is an ADC1 pin (ADC2 is unusable while WiFi is up). No pin move was needed.
#
# No charge-status GPIO exists on this board, so "charging" is inferred from a sustained
# high reading (id(batt_charging), set below). The reading is only a pack voltage with USB
# UNPLUGGED: with the cable in, the TP4056 holds the BAT net at the charge voltage (~4.2 V),
# which is what makes the number look flat while charging -- and why the page prints CHG
# instead of a percentage it cannot stand behind. The percentage comes from a piecewise
# Li-ion discharge curve, approximate under load -- the panel sags the cell while it is on.
text_sensor:
  # The inference itself, on a slow poll (the ADC's own averaging sends every 10 s, so a faster
  # poll would only re-read the same value). Exported to HA so it can be checked without
  # standing at the panel: cable in, CHG once the pack reaches the CV plateau; cable out, BATT
  # once the reading has dropped clear of it.
  - platform: template
    id: batt_state
    name: "Panel battery state"
    icon: mdi:battery-charging
    update_interval: 30s
    lambda: |-
      const float v = id(batt_v).state;
      if (isnan(v)) return std::string("--");
      // Enter on the charger's CV plateau -- the TP4056 rests at 4.20 V there -- and leave only
      // 100 mV below it. 4.20 is above anything a resting cell reaches under this panel's load
      // (4.16 unloaded, ~4.05 with the backlight on), so a full cell off-charge stays BATT; the
      // plateau still runs 19 polls above it in the recorded history, so entry is never missed.
      const bool want = id(batt_charging) ? (v < 4.10f) : (v >= 4.20f);
      // Two agreeing polls (60 s). One sample is not evidence: the history contains a two-minute
      // excursion from 4.25 V down to 3.04 V in the middle of a charge, which a single poll
      // cannot tell apart from a genuine unplug. It still shows as a brief flip -- accepted, and
      // bounded by tools/test_batt_state.py rather than hidden.
      id(batt_agree) = want ? id(batt_agree) + 1 : 0;
      if (id(batt_agree) >= 2) {
        id(batt_charging) = !id(batt_charging);
        id(batt_agree) = 0;
      }
      return id(batt_charging) ? std::string("CHG") : std::string("BATT");

sensor:
  # ---- JK-BMS, imported from Home Assistant --------------------------------------------
  # The bench pack's JK BMS is already integrated in HA (jk_bms); these import four of its
  # entities instead of putting a second reader on the same BMS. HA pushes the live state
  # when the panel connects and again on every change, so the panel runs no polling loop and
  # holds no credential of its own. `internal` defaults to true for imports, so they do not
  # turn up on the panel's own HA device page. State is NAN until that first push -- the
  # display prints "--" rather than a number it cannot vouch for.
  - platform: homeassistant
    entity_id: sensor.jk_bms_jk_bms_state_of_charge
    id: bms_soc
    on_value:
      then:
        - component.update: my_display

  - platform: homeassistant
    entity_id: sensor.jk_bms_jk_bms_total_voltage
    id: bms_v
    on_value:
      then:
        - component.update: my_display

  - platform: homeassistant
    entity_id: sensor.jk_bms_jk_bms_current
    id: bms_i
    on_value:
      then:
        - component.update: my_display

  - platform: homeassistant
    entity_id: sensor.jk_bms_jk_bms_temperature_sensor_1
    id: bms_t
    on_value:
      then:
        - component.update: my_display

  - platform: adc
    pin: GPIO5
    id: batt_v
    name: "Battery voltage"
    attenuation: 12db
    update_interval: 5s
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 1.72727                 # 160K/220K FITTED divider (schematic's 33K/100K is wrong). Valid ONLY when USB is UNPLUGGED.
      # With USB plugged in the TP4056 drives the BAT net, so the reading is the charger's
      # output rather than the cell -- which is why the page shows CHG (id(batt_state)) then.
      - clamp:
          min_value: 2.5
          max_value: 4.3
          ignore_out_of_range: true
      - sliding_window_moving_average:
          window_size: 6
          send_every: 2
    # Per-read debug line on the console: GPIO, raw ADC counts, computed pin volts,
    # computed battery volts. ESPHome allows one adc sensor per pin, so the raw counts
    # come from this sensor's own channel through its public output_raw switch: one
    # extra sample per logged read, then straight back to volts.
    on_value:
      then:
        - lambda: |-
            const float DIVIDER = 1.72727f;   // 1 / (220/(160+220))
            id(batt_v).set_output_raw(true);
            int raw = (int) (id(batt_v).sample() + 0.5f);
            id(batt_v).set_output_raw(false);
            ESP_LOGI("battery", "GPIO5 (ADC1_CH4) raw=%d pin=%.4f V batt=%.4f V state=%s",
                     raw, x / DIVIDER, x, id(batt_charging) ? "CHG" : "BATT");

  - platform: template
    id: batt_pct
    name: "Battery"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      // piecewise-linear 1S Li-ion curve: resting volts -> state of charge
      static const float v[] = {3.00, 3.45, 3.68, 3.74, 3.77, 3.79, 3.82, 3.87, 3.93, 4.00, 4.10, 4.20};
      static const float p[] = {  0.0, 5.0, 10.0, 20.0, 30.0, 40.0, 50.0, 60.0, 70.0, 80.0, 90.0, 100.0};
      float x = id(batt_v).state;
      if (isnan(x)) return NAN;
      // The curve above is a RESTING-voltage curve, but this reading is the cell's terminal
      // voltage under the panel's own load, so it sits a few points low. The backlight is the
      // largest single load and its duty is known to the firmware, so add that part of the sag
      // back (constant is measured, see tools/calibrate_batt_sag.py). Not applied while
      // charging: there the reading is the charger's net rather than a loaded cell, and the
      // header masks the number anyway.
      if (!id(batt_charging)) {
        const auto &bl = id(display_backlight).current_values;
        x += ${batt_sag_v_per_duty} * (bl.is_on() ? bl.get_brightness() : 0.0f);
      }
      if (x <= v[0]) return 0.0f;
      if (x >= v[11]) return 100.0f;
      for (int i = 0; i < 11; i++) {
        if (x <= v[i + 1]) {
          float t = (x - v[i]) / (v[i + 1] - v[i]);
          return p[i] + t * (p[i + 1] - p[i]);
        }
      }
      return 100.0f;
    on_value:
      then:
        - component.update: my_display
