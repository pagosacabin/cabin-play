; 0227 -- the photograph on the 64-colour build (N16R8).
; Same driver as 0226; the test card is replaced by one dithered photograph that
; is embedded in the app image, with the framebuffer's SHA-256 checked at boot.
[env:n16r8-photo]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

; ---- higher modes: the 22" TV rescales 640x480 by a non-integer factor, which
; is what reads as "pixelated".  Same driver, same pins, bigger raster.
[env:n16r8-photo-800x600]
extends = env:n16r8-photo
build_flags =
    -DOUT_W=800
    -DOUT_H=600
    -DBB_LINES=15
    -DPCLK_HZ=40000000u
    -DH_SYNC_PW=128
    -DH_BACK_PORCH=88
    -DH_FRONT_PORCH=40
    -DV_SYNC_PW=4
    -DV_BACK_PORCH=23
    -DV_FRONT_PORCH=1

[env:n16r8-photo-1024x768]
extends = env:n16r8-photo
build_flags =
    -DOUT_W=1024
    -DOUT_H=768
    -DPCLK_HZ=65000000u
    -DH_SYNC_PW=136
    -DH_BACK_PORCH=160
    -DH_FRONT_PORCH=24
    -DV_SYNC_PW=6
    -DV_BACK_PORCH=29
    -DV_FRONT_PORCH=3
