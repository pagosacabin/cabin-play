; 0227 -- the photograph on the 64-colour build (N16R8).
; Same driver as 0226; the test card is replaced by one dithered photograph that
; is embedded in the app image, with the framebuffer's SHA-256 checked at boot.
[env:n16r8-photo]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
