; ---------------------------------------------------------------------------
;  Task 0225 -- N16R8 probe.  ONE board, the one Stephen wired on 2026-11-20.
;
;  This firmware answers four questions and nothing else:
;    1. what silicon is actually here (chip, flash size, PSRAM size)
;    2. is the claimed 8 MB of PSRAM real (full-range pattern write/read)
;    3. do the 12 silkscreened pins behave like the GPIOs they claim
;    4. what is on the inserted SD card (READ-ONLY: raw sector reads, no mount,
;       no format, no writes)
;
;  It does NOT start the 64-colour port.  Task 0225 is the gate, not the port.
;
;  Target identified by MAC c4:9e:7e:08:6d:f4 on /dev/ttyUSB0, reached through
;  the FTDI FT232R UART bridge (0403:6001) Stephen wired.  Do not flash
;  /dev/ttyACM* (ESP32-C3 propane bench) or the Heltec's 0180 build.
;
;  Board selection notes:
;    - esp32-s3-devkitc-1 is used as a generic S3 description; the real part is
;      a YD-ESP32-23 / S3-N16R8 clone (16 MB flash + 8 MB octal PSRAM claimed).
;    - sdkconfig.defaults turns SPIRAM on in OCTAL mode.  A quad-mode build on
;      an octal part reports 0 bytes, which is exactly the false negative that
;      cost 0178 an afternoon on the Heltec (S3FN8, no PSRAM at all).
; ---------------------------------------------------------------------------

[env:n16r8]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
