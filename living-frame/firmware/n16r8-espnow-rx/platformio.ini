; 0230 rung 2 -- ESP-NOW receive test on the frame board (N16R8, ESP32-S3).
;
; The frame board's FT232R console delivers no usable output (0225), so the
; receipt log goes to the `report` data partition at 0x310000, exactly as
; 0225/0226/0227 do, and is read back with esptool read_flash.
;
; This is a TEST build: it drives no display.  The accepted 800x600 photo build
; (env n16r8-photo-800x600) goes back on the board when the rung ends.
[env:n16r8-espnow-rx]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
