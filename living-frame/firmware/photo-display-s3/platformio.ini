; ---------------------------------------------------------------------------
;  Living-frame rung 3a -- LCD_CAM VGA scanout on the Heltec WiFi LoRa 32 V3
;  (ESP32-S3FN8, 8 MB flash, NO PSRAM), mailbox task 0179.
;
;  Framework: ESP-IDF 5.5 (plain, not Arduino) -- esp_lcd's RGB panel driver is
;  the LCD_CAM front end, and this rung uses its no-framebuffer + bounce-buffer
;  mode, which does not exist in the Arduino core's bundled IDF 4.4.
;
;  Board: board = esp32-s3-devkitc-1 is used only as a generic S3 description
;  (8 MB flash, no PSRAM); the physical target is identified by MAC
;  9c:13:9e:a1:37:40 on /dev/ttyUSB1 (CP2102 UART bridge). Do not flash
;  /dev/ttyUSB0 (classic ESP32-D0WD) or /dev/ttyACM0 (ESP32-C3).
;
;  Every graphics decision that matters (pin map -> data byte -> pin) lives in
;  src/main.cpp's header comment so it can be checked without reading code.
; ---------------------------------------------------------------------------

[env:heltec-s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1

build_flags =
    -DIDF_MAIN_TASK_STACK_SIZE=6144

; sdkconfig.defaults (same directory) pins the rest: 8 MB flash, no PSRAM,
; -O2 (the bounce-buffer fill runs in an ISR), 1000 Hz tick.
