; 0243 -- SD-card slideshow on the living frame (N16R8, ESP32-S3).
;
; Two apps, one source file:
;   n16r8-slideshow        the slideshow (mounts the card, cycles FRAMES)
;   n16r8-slideshow-stage  copies the `frames` flash partition onto the card and
;                          verifies every file by SHA-256, then halts
;
; Display settings are the accepted build's 800x600 gamma mode
; (n16r8-photo, env n16r8-photo-800x600) -- same pins, same timing, same
; 15-line bounce buffers.  SD is the proven 0229/0239/0241 stack: SCK 12,
; MOSI 11, MISO 13, CS 10, SPI mode 0, 400 kHz, 0239 pre-sacrifice before the
; single stock-driver init.
;
; upload_port is the FT232R bridge (/dev/ttyUSB0).  Its console delivers
; nothing (0225); the report partition is the log.

[env:n16r8-slideshow]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
build_flags =
    -DOUT_W=800
    -DOUT_H=600
    -DBB_LINES=15
    -DPCLK_HZ=40000000u
    -DH_SYNC_PW=128
    -DH_BACK_PORCH=88
    -DH_FRONT_PORCH=40
    -DV_SYNC_PW=4
    -DV_BACK_PORCH=23
    -DV_FRONT_PORCH=1

[env:n16r8-slideshow-stage]
extends = env:n16r8-slideshow
build_flags = ${env:n16r8-slideshow.build_flags} -DAPP_STAGE=1
