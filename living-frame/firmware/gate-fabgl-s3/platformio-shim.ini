; Second gate probe: identical build, but with shim/soc/frc_timer_reg.h on the
; include path so the FIRST missing ESP32-only header is papered over. This is a
; diagnostic only — it is what proves the port is a codebase port rather than a
; one-header fix. The stub's values are never executed.
;
; Run with:  pio run -c platformio-shim.ini -e heltec

[env:heltec]
platform = espressif32@6.12.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -I shim
lib_deps =
    fabgl@1.0.9
