# Guition JC4827W543C — 4.3" 480x272 IPS, ESP32-S3-WROOM-1-N4R8 (4 MB flash / 8 MB OPI PSRAM)
# Board verified on the bench 2026-10-13 as MAC 44:bd:8d:7a:cc:cc, /dev/ttyACM2.
# Panel controller NV3041A over QSPI is PROVEN from the factory firmware's own init table,
# not from the vendor PDF (which wrongly claims "ST3401A").
# Config follows the official ESPHome device page for this board:
#   https://devices.esphome.io/devices/guition-jc4827543c
substitutions:
  name: jc4827w543
  friendly_name: Bench Panel 4.3
  # LAN service that serves one random photo, already scaled to 480x272 (~11 KB JPEG).
  # Source lives at ~/panel-photo/panel_photo_server.py on 192.168.1.228.
  # Served by the VPS (nginx + same-host publisher, see panel-photo units there).
  # Basic-auth protected: these are personal photos on a public host.
  photo_url: https://nordtronics.io/panel/random.jpg

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio          # vendor demo/spec use DIO, not QIO
  on_boot:
    priority: -100
    then:
      - script.execute: inactivity_timer
      - component.update: my_display

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

# Top-level component in current ESPHome (not nested under esp32):
# the N4R8 module carries octal/OPI PSRAM.
psram:
  mode: octal
  speed: 80MHz

logger:
  # The board's console is its native USB (USB-Serial/JTAG), not a UART bridge.
  level: INFO

api:
  # Keyless on purpose: there is no ESPHome dashboard on this network to read a generated
  # key from, and Home Assistant adopts an unencrypted API device without prompting. To
  # lock it down later, add `encryption: {key: !secret api_encryption_key}`, put a 32-byte
  # base64 key in secrets.yaml, and re-flash over USB once.

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # No fallback hotspot: if the join fails we revisit over USB, where the
  # console is always available.
  power_save_mode: none                  # a wall/mains panel wants latency over mW

# ---------------------------------------------------------------- backlight
output:
  - platform: ledc
    pin: 1                               # GFX_BL / LCD_BL on GPIO1 (all sources agree)
    id: gpio_backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    id: display_backlight
    icon: mdi:lightbulb-on
    restore_mode: ALWAYS_ON

# ---------------------------------------------------------------- touch (GT911)
i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO4
    scan: true
    frequency: 400kHz

touchscreen:
  - platform: gt911
    id: my_touchscreen
    i2c_id: bus_a
    interrupt_pin:
      number: 3
      ignore_strapping_warning: true
    reset_pin: GPIO38
    transform:
      mirror_x: true
      mirror_y: true
    # Without this binding the panel is a display with no input: the GT911 still reports
    # touches on I2C and the interrupt still fires, but nothing acts on them, so the
    # backlight never comes back after the inactivity timer switches it off. Every touch
    # restarts the timer, whose first step also turns the backlight back on at full.
    on_touch:
      then:
        - script.execute: inactivity_timer

# ---------------------------------------------------------------- panel (NV3041A, quad SPI)
# KNOWN-GOOD configuration for this unit. Do NOT "modernise" this block to the mipi_spi
# platform / built-in `model: JC4827W543` preset: that build drove this panel into a
# rainbow-noise state (2026-10-13), while this explicit form renders correctly. qspi_dbi
# is deprecated (a warning, not an error) -- a working picture outranks a clean warning.
spi:
  id: quad_spi
  type: quad
  clk_pin: GPIO47
  data_pins: [21, 48, 40, 39]

display:
  - platform: qspi_dbi
    id: my_display
    update_interval: never               # only repaint when something changes
    auto_clear_enabled: false
    model: CUSTOM
    data_rate: 20MHz
    dimensions:
      width: 480
      height: 272
    cs_pin:
      number: 45
      ignore_strapping_warning: true
    invert_colors: true
    rotation: 180
    init_sequence:
      - [0xff, 0xa5]
      - [0x36, 0xc0]
      - [0x3A, 0x01]
      - [0x41, 0x03]
      - [0x44, 0x15]
      - [0x45, 0x15]
      - [0x7d, 0x03]
      - [0xc1, 0xbb]
      - [0xc2, 0x05]
      - [0xc3, 0x10]
      - [0xc6, 0x3e]
      - [0xc7, 0x25]
      - [0xc8, 0x11]
      - [0x7a, 0x5f]
      - [0x6f, 0x44]
      - [0x78, 0x70]
      - [0xc9, 0x00]
      - [0x67, 0x21]
      - [0x51, 0x0a]
      - [0x52, 0x76]
      - [0x53, 0x0a]
      - [0x54, 0x76]
      - [0x46, 0x0a]
      - [0x47, 0x2a]
      - [0x48, 0x0a]
      - [0x49, 0x1a]
      - [0x56, 0x43]
      - [0x57, 0x42]
      - [0x58, 0x3c]
      - [0x59, 0x64]
      - [0x5a, 0x41]
      - [0x5b, 0x3c]
      - [0x5c, 0x02]
      - [0x5d, 0x3c]
      - [0x5e, 0x1f]
      - [0x60, 0x80]
      - [0x61, 0x3f]
      - [0x62, 0x21]
      - [0x63, 0x07]
      - [0x64, 0xe0]
      - [0x65, 0x02]
      - [0xca, 0x20]
      - [0xcb, 0x52]
      - [0xcc, 0x10]
      - [0xcd, 0x42]
      - [0xd0, 0x20]
      - [0xd1, 0x52]
      - [0xd2, 0x10]
      - [0xd3, 0x42]
      - [0xd4, 0x0a]
      - [0xd5, 0x32]
      - [0x80, 0x00]
      - [0xa0, 0x00]
      - [0x81, 0x07]
      - [0xa1, 0x06]
      - [0x82, 0x02]
      - [0xa2, 0x01]
      - [0x86, 0x11]
      - [0xa6, 0x10]
      - [0x87, 0x27]
      - [0xa7, 0x27]
      - [0x83, 0x37]
      - [0xa3, 0x37]
      - [0x84, 0x35]
      - [0xa4, 0x35]
      - [0x85, 0x3f]
      - [0xa5, 0x3f]
      - [0x88, 0x0b]
      - [0xa8, 0x0b]
      - [0x89, 0x14]
      - [0xa9, 0x14]
      - [0x8a, 0x1a]
      - [0xaa, 0x1a]
      - [0x8b, 0x0a]
      - [0xab, 0x0a]
      - [0x8c, 0x14]
      - [0xac, 0x08]
      - [0x8d, 0x17]
      - [0xad, 0x07]
      - [0x8e, 0x16]
      - [0xae, 0x06]
      - [0x8f, 0x1B]
      - [0xaf, 0x07]
      - [0x90, 0x04]
      - [0xb0, 0x04]
      - [0x91, 0x0a]
      - [0xb1, 0x0a]
      - [0x92, 0x16]
      - [0xb2, 0x15]
      - [0xff, 0x00]
      - [0x11, 0x00]
      - [0x29, 0x00]
    lambda: |-
      // repaint from a clean slate: auto_clear_enabled is false, and this lambda now runs
      // on every battery sensor update, so text would otherwise smear
      it.fill(COLOR_OFF);

      if (id(show_photo) && id(photo).is_loaded()) {
        // idle screensaver: photo arrives a moment after the dim, then repaints
        it.image(0, 0, id(photo));
        return;
      }

      it.print(240, 24, id(roboto_20), TextAlign::CENTER, "JC4827W543 up");

      if (!isnan(id(batt_pct).state)) {
        char buf[48];
        snprintf(buf, sizeof(buf), "BAT %3.0f%%   %.2f V", id(batt_pct).state, id(batt_v).state);
        it.print(240, 84, id(roboto_20), TextAlign::CENTER, buf);
      } else {
        it.print(240, 84, id(roboto_20), TextAlign::CENTER, "BAT --");
      }

      const int bx = 170, by = 150, bw = 120, bh = 52, nub = 8, pad = 4;
      it.rectangle(bx, by, bw, bh, COLOR_ON);
      it.filled_rectangle(bx + bw + 1, by + bh / 3, nub, bh / 3, COLOR_ON);
      float pct = isnan(id(batt_pct).state) ? 0.0f : id(batt_pct).state;
      int fillw = (int)((bw - 2 * pad) * pct / 100.0f);
      if (fillw > 0) it.filled_rectangle(bx + pad, by + pad, fillw, bh - 2 * pad, COLOR_ON);

font:
  - file: "gfonts://Roboto"
    id: roboto_20
    size: 24

# ---------------------------------------------------------------- random photo on idle
# The panel cannot scale a photo itself: a 12 MP original is ~12 MB of decoded bitmap
# against 8 MB of PSRAM. ${photo_url} therefore serves an image already cropped and scaled
# to 480x272, and the panel only downloads and decodes it.
# online_image needs an explicit http_request client; plain HTTP to the LAN service, so no
# TLS verification is involved.
http_request:
  id: http_client
  timeout: 10s
  useragent: esphome-jc4827w543

online_image:
  - id: photo
    # The component's own url is NOT templatable (only the set_url action is), so this is a
    # static fallback; the cache-buster is applied by the set_url call in show_random_photo.
    url: ${photo_url}
    type: RGB565                 # required: full-colour panel
    format: AUTO                 # let the Content-Type pick the decoder (JPEG here)
    buffer_size: 65536
    # nginx gates /panel/ with HTTP Basic auth; the value is a precomputed header in
    # secrets.yaml so the password itself is never in this file. ESPHome carries it
    # as a request header -- the capability that made this design possible.
    request_headers:
      Authorization: !secret panel_auth_header
    on_download_finished:
      - component.update: my_display

globals:
  - id: show_photo
    type: bool
    initial_value: 'false'

# ---------------------------------------------------------------- backlight sleep
# Touch or boot restarts the timer; the panel dims to off after sleep_time seconds.
# This is the battery-relevant knob: the panel is the dominant load.
script:
  - id: show_random_photo
    then:
      - globals.set:
          id: show_photo
          value: 'true'
      - online_image.set_url:
          id: photo
          url: !lambda |-
            return std::string("${photo_url}?r=") + to_string((uint32_t) millis());
      - component.update: my_display

  - id: inactivity_timer
    mode: restart
    then:
      # any touch (or boot) wakes the panel: status screen back, full brightness
      - globals.set:
          id: show_photo
          value: 'false'
      - light.turn_on:
          id: display_backlight
          brightness: 1.0
      - component.update: my_display
      - delay: !lambda 'return id(sleep_time).state * 1000;'
      # idle: fetch a fresh random photo and dim to the configured level
      - script.execute: show_random_photo
      # idle: DIM to the configured level rather than going black. Set Idle brightness to 0
      # to get the old full-off behaviour back.
      - if:
          condition:
            lambda: 'return id(dim_level).state > 0.5f;'
          then:
            - light.turn_on:
                id: display_backlight
                brightness: !lambda 'return id(dim_level).state / 100.0f;'
          else:
            - light.turn_off: display_backlight

number:
  - platform: template
    name: Sleep time
    id: sleep_time
    optimistic: true
    initial_value: 60
    restore_value: yes
    unit_of_measurement: "s"
    device_class: duration
    mode: box
    min_value: 5
    max_value: 600
    step: 1

  # Slider in Home Assistant: how bright the panel sits once it has idled past Sleep time.
  # 0 = dim to nothing (panel off), the pre-2026-10-13 behaviour.
  - platform: template
    name: Idle brightness
    id: dim_level
    optimistic: true
    initial_value: 10
    restore_value: yes
    unit_of_measurement: "%"
    mode: slider
    min_value: 0
    max_value: 100
    step: 5

# Remote wake: runs the same inactivity timer a touch would, which restores full brightness
# and restarts the countdown. Makes the idle/dim behaviour testable without a finger, and
# gives HA a "light the panel now" control.
button:
  - platform: template
    name: Wake screen
    id: wake_button
    on_press:
      - script.execute: inactivity_timer

  - platform: template
    name: Next image
    id: next_image_button
    on_press:
      - script.execute: show_random_photo

# ---------------------------------------------------------------- battery sense
# FITTED divider is 160K/220K, NOT the 33K/100K the vendor schematic draws:
#     BAT --[160K]--+--[220K]-- GND        +--[0R]--> GPIO5 == ADC1_CH4
# so the ADC sees 220/(160+220) = 0.57895 of the pack voltage: multiply by 1/0.57895
# = 1.72727 to get volts at the battery. A full 4.2 V pack puts the node at 2.43 V,
# comfortably inside a 12 dB ADC range (~3.1 V), so nothing clips -- which is why the
# attenuation below is a fixed 12db rather than `auto` (auto existed only to chase the
# 3.16 V node the WRONG divider implied; it also cannot be combined with `raw:`).
# Fitted-vs-drawn is documented for this board, not guessed:
#   https://github.com/78/xiaozhi-esp32/blob/HEAD/main/boards/guition/jc4827w543/README.md
#   -- "The battery divider is not what the schematic draws. The schematic shows
#   33K/100K, factor 1.33; the fitted parts are 160K/220K, factor ~1.73".
# History: the 1.33 factor read 3.27 V on a pack the meter put at 4.1 V (2026-10-15).
# The same ADC node, rescaled by 1.72727, reads 4.24 V -- i.e. the BAT net held at the
# charge voltage by the on-board TP4056 while USB is connected.
#
# GPIO5 stays the pin: the vendor pin table calls it "Battery divider to ADC1_CH4", and
# it is an ADC1 pin (ADC2 is unusable while WiFi is up). No pin move was needed.
#
# No charge-status GPIO exists on this board, so "charging" is inferred from a sustained
# high reading. The reading is only a pack voltage with USB UNPLUGGED: with the cable in,
# the TP4056 holds the BAT net at the charge voltage (~4.2 V), which is what makes the
# number look flat while charging. The percentage comes from a piecewise Li-ion discharge
# curve, approximate under load -- the panel sags the cell while it is on.
sensor:
  - platform: adc
    pin: GPIO5
    id: batt_v
    name: "Battery voltage"
    attenuation: 12db
    update_interval: 5s
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 1.72727                 # 160K/220K FITTED divider (schematic's 33K/100K is wrong). Valid ONLY when USB is UNPLUGGED.
      # With USB plugged in, the TP4056 charger drives the BAT net; reading reflects charger output, not battery.
      - clamp:
          min_value: 2.5
          max_value: 4.3
          ignore_out_of_range: true
      - sliding_window_moving_average:
          window_size: 6
          send_every: 2
    # Per-read debug line on the console: GPIO, raw ADC counts, computed pin volts,
    # computed battery volts. ESPHome allows one adc sensor per pin, so the raw counts
    # come from this sensor's own channel through its public output_raw switch: one
    # extra sample per logged read, then straight back to volts.
    on_value:
      then:
        - lambda: |-
            const float DIVIDER = 1.72727f;   // 1 / (220/(160+220))
            id(batt_v).set_output_raw(true);
            int raw = (int) (id(batt_v).sample() + 0.5f);
            id(batt_v).set_output_raw(false);
            ESP_LOGI("battery", "GPIO5 (ADC1_CH4) raw=%d pin=%.4f V batt=%.4f V",
                     raw, x / DIVIDER, x);

  - platform: template
    id: batt_pct
    name: "Battery"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      // piecewise-linear 1S Li-ion curve: resting volts -> state of charge
      static const float v[] = {3.00, 3.45, 3.68, 3.74, 3.77, 3.79, 3.82, 3.87, 3.93, 4.00, 4.10, 4.20};
      static const float p[] = {  0.0, 5.0, 10.0, 20.0, 30.0, 40.0, 50.0, 60.0, 70.0, 80.0, 90.0, 100.0};
      float x = id(batt_v).state;
      if (isnan(x)) return NAN;
      if (x <= v[0]) return 0.0f;
      if (x >= v[11]) return 100.0f;
      for (int i = 0; i < 11; i++) {
        if (x <= v[i + 1]) {
          float t = (x - v[i]) / (v[i + 1] - v[i]);
          return p[i] + t * (p[i + 1] - p[i]);
        }
      }
      return 100.0f;
    on_value:
      then:
        - component.update: my_display
